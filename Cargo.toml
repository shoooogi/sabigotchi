[package]
name = "sabigotchi"
version = "0.1.0"
authors = ["shoooogi <guilhermecomputation@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
dioxus-google-fonts = "0.1.5"
dioxus-sdk-time = "0.7"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
